<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Table</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }

    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse; /* Merges cell borders into a single clean border */
    }

    th, td {
      border: 1px solid #d1d5db;
      padding: 0.75rem 1rem;
      text-align: left;
    }

    th {
      background-color: #f3f4f6;
      font-weight: 600;
      color: #1f2937;
    }

    /* Alternate row zebra striping */
    tbody tr:nth-child(even) {
      background-color: #f9fafb;
    }

    tbody tr:hover {
      background-color: #f0f4f8;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Role</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Jane Doe</td>
        <td>Developer</td>
        <td>Active</td>
      </tr>
      <tr>
        <td>2</td>
        <td>John Smith</td>
        <td>Designer</td>
        <td>Active</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Alex Rivera</td>
        <td>Manager</td>
        <td>Away</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
